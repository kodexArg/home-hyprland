#!/usr/sbin/nft -f
# kdx — zensid host firewall (installed to /etc/nftables.conf by
# `sudo kdx-bootstrap-zensid firewall`). Inbound default-drop.
#
# Why: stremio-server (server.js 4.20.16) hard-codes listen(11470) / listen(12470)
# on all addresses (no host option) and the torrent engine listens on 6881;
# zensid also has a global IPv6 address. Instead of patching server.js (overwritten
# by package updates), nothing inbound is accepted except what is listed here.
# Loopback is untouched, so Stremio UI -> http://127.0.0.1:11470 keeps working,
# and outbound torrent/tracker/DHT traffic works via conntrack (established).
flush ruleset

table inet kdx_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP / ICMPv6 (ping, PMTU, IPv6 neighbour discovery + RA)
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # DHCP client replies (v4 + v6)
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # mDNS (avahi: printers / .local names) — multicast only
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept

        # sshd (already exposed before the firewall; kept open on purpose)
        tcp dport 22 accept

        # everything else — incl. 11470-11474, 12470, 6881 (Stremio) — dropped
        counter comment "kdx-dropped"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
