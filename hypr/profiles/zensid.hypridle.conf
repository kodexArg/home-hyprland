general {
    # zensid power policy: NEVER suspend (media box on the Samsung TV).
    # sleep/suspend/hibernate targets are masked + logind ignores the lid
    # (bin/kdx-bootstrap-zensid nosleep). No idle listeners here on purpose;
    # Stremio/VLC/mpv fullscreen also get idle_inhibit via window rule.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}
