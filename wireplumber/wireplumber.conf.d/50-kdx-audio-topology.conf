# Modern 2026 Host Audio Topology (kdx SSoT)
# Outputs:
#   Primary:   NVIDIA TU106 HDMI -> AOC G2790G4 (HDMI-A-1)
#   Secondary: AMD Ryzen ALC897 Analog Line-Out (Motherboard jack)
#   Disabled:  AMD Renoir APU HDMI (No display attached)
# Inputs:
#   Primary:   Logitech Brio 100 Mono (USB)

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Auriculares (HDMI AOC G2790G4)"
        node.nick = "Auriculares HDMI"
        priority.driver = 1000
        priority.session = 1000
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_08_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Parlantes (motherboard)"
        node.nick = "Parlantes MB"
        priority.driver = 800
        priority.session = 800
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card.pci-0000_08_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.usb-046d_Brio_100_2545ZBK1FP68-02.mono-fallback" }
    ]
    actions = {
      update-props = {
        node.description = "Brio 100 Mono"
        node.nick = "Brio 100"
        priority.driver = 1000
        priority.session = 1000
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
