# JBL TUNE510BT stays A2DP. Mic is always Brio + EasyEffects, never HSP/HFP
# autoswitch. HLL (and any VoIP) opens a capture stream; if autoswitch is on,
# WirePlumber flips the headphones to headset profile and A2DP dies.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
