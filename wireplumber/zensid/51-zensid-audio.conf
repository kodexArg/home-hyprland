# kdx — zensid audio policy (symlinked to ~/.config/wireplumber/wireplumber.conf.d/).
#  * Internal speaker is never an option: PCH card uses a headphones-only profile-set.
#  * HDMI (Samsung TV on HDMI-A-1) always wins when connected (highest priority).
#  * Headphones (3.5 mm jack) are allowed, below HDMI.
#  * Neither connected = no audible output (no speaker sink/port exists).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1b.0" } ]
    actions = {
      update-props = {
        device.profile-set = "/home/kodex/home-hyprland/wireplumber/zensid/pch-headphones-only.profile-set.conf"
        device.description = "Auriculares (jack)"
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_03.0" } ]
    actions = { update-props = { device.description = "HDMI (TV Samsung)" } }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-0000_00_03.0.*" } ]
    actions = {
      update-props = {
        node.description = "TV Samsung (HDMI)"
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-0000_00_1b.0.*" } ]
    actions = {
      update-props = {
        node.description = "Auriculares (jack)"
        priority.driver = 500
        priority.session = 500
      }
    }
  }
]
