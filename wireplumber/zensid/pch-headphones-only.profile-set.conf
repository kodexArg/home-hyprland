# kdx — zensid (Asus Zenbook UX303, Intel PCH + Conexant CX20751/2) ACP profile-set.
# Same as alsa-card-profile default.conf "analog-stereo" but the only output path is
# analog-output-headphones: the internal speaker port does not exist at all, and the
# headphones path forces ALSA "Speaker" switch=off. No headphones plugged = silence.
# Used via device.profile-set in 51-zensid-audio.conf (absolute path).

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output-headphones
paths-input = analog-input-internal-mic analog-input-mic analog-input-headphone-mic analog-input-headset-mic
priority = 15
