# WebRTC DSP Clean Voice filter for Brio 100 (Debian Sid / PipeWire)
pulse.cmd = [
    {
        cmd = "load-module"
        args = "module-echo-cancel source_name=brio_voice_clean source_properties=device.description=Brio-100-Clean-Voice aec_method=webrtc aec_args=\"high_pass_filter=1 noise_suppression=1 transient_suppression=1 gain_control=1\""
        flags = [ ]
    }
]
