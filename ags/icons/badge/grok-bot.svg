<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Grok Bot: silueta del icono oficial (/usr/share/icons/hicolor/512x512/apps/grok-bot.png, paquete grok-bot 0.61.0), monocromo bicolor, ojos agrandados para 13px -->
  <defs>
    <clipPath id="gb-sq"><rect x="0" y="0" width="24" height="24" rx="5"/></clipPath>
    <mask id="gb-eyes">
      <rect width="24" height="24" fill="white"/>
      <rect x="-2.1" y="-3.8" width="4.2" height="7.6" rx="2.1" fill="black" transform="translate(10.6 14.9) rotate(-35.5)"/>
      <rect x="-1.8" y="-3.8" width="3.6" height="7.6" rx="1.8" fill="black" transform="translate(17.9 11.2) rotate(-35.5)"/>
    </mask>
  </defs>
  <g clip-path="url(#gb-sq)"><g mask="url(#gb-eyes)">
    <rect width="24" height="24" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="9.75" cy="19.6" r="14.8" fill="#ffffff"/></g>
  </g>
</svg>
